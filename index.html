<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Dive into Sharkie's underwater arcade adventure. Explore the ocean, collect treasure and take on the final boss.">
    <meta name="theme-color" content="#073b79">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sharkie — Underwater Arcade Adventure">
    <meta property="og:description"
        content="Explore the ocean, collect treasure and take on the final boss in this underwater arcade game.">
    <title>Sharkie — Underwater Arcade Adventure</title>
    <link rel="icon" href="./img/icons/light-dark mode.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="js/audio.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/models/drawable.class.js"></script>
    <script src="js/models/movable-objects.class.js"></script>
    <script src="js/models/statusbarhealth.class.js"></script>
    <script src="js/models/statusbarcoin-class.js"></script>
    <script src="js/models/statusbarpoisen.class.js"></script>
    <script src="js/models/throwpoisen.class.js"></script>
    <script src="js/models/throwbubble.class.js"></script>
    <script src="js/models/background/bg-water.class.js"></script>
    <script src="js/models/background/bg-fondo1.class.js"></script>
    <script src="js/models/background/bg-fondo2.class.js"></script>
    <script src="js/models/background/floor1.class.js"></script>
    <script src="js/models/background/light.class.js"></script>
    <script src="js/models/player.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/models/enemy-fish.class.js"></script>
    <script src="js/models/enemy-jelly.class.js"></script>
    <script src="js/models/coins.class.js"></script>
    <script src="js/models/poisen.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>

<body>
    <main id="mainmenu" aria-label="Sharkie game menu">
        <div class="icon-div">
            <button class="icon" id="controls" type="button" aria-label="Show game controls" onclick="openControl()">
                <svg class="icon-img" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960"
                    width="24">
                    <path d="M160-200q-33 0-56.5-23.5T80-280v-400q0-33 23.5-56.5T160-760h640q33 0 
                        56.5 23.5T880-680v400q0 33-23.5 56.5T800-200H160Zm0-80h640v-400H160v400Zm160-40h320v-80H320v80ZM200-440h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 
                        0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80ZM200-560h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 0h80v-80h-80v80Zm120 
                        0h80v-80h-80v80ZM160-280v-400 400Z" />
                </svg>
            </button>
        </div>
        <div class="menu-content">
            <h1 id="heading">Sharkie</h1>
            <p class="menu-tagline">An underwater arcade adventure</p>
            <p class="menu-details">Explore the ocean · Collect treasure · Face the boss</p>
            <button class="menu-start" type="button" onclick="mainMenuStart()">
                <img class="start-button" src="./img/6.Botones/Start/4.png" alt="Start game">
            </button>
        </div>
    </main>
    <canvas id="canvas" width="720" height="480" role="img"
        aria-label="Sharkie underwater arcade game" style="display: none;"></canvas>


    <div class="mobile-hud" id="mobile-hud" role="group" aria-label="Touch controls" style="display: none;">
        <div class="hud-shoot hud-none">
            <button id="btn-shoot" type="button" aria-label="Throw poison"><img
                    src="./img/4. Marcadores/Poisen/Animada/2.png" alt="" height="30" width="30"></button>
            <button id="btn-bubble" type="button" aria-label="Throw bubble"><img
                    src="./img/1.Sharkie/Bubble trap/Bubble.png" alt="" height="30" width="30"></button>
        </div>
        <div>
            <button id="btn-fullscreen" type="button" onclick="toggleFullscreen()">Fullscreen</button>
            <button id="btn-audio" type="button" aria-label="Toggle sound" onclick="setAudio()">Mute</button>
        </div>
        <div class="hud-swim hud-none">
            <button id="btn-up" type="button" aria-label="Swim up">↑</button>
            <div>
                <button id="btn-left" type="button" aria-label="Swim left">←</button>
                <button id="btn-down" type="button" aria-label="Swim down">↓</button>
                <button id="btn-right" type="button" aria-label="Swim right">→</button>
            </div>
        </div>
    </div>
    <div id="rotate">
        <h1>Please rotate your screen</h1>
        <img id="rotateScreenImage" src="./img/mobile-rotate.png" alt="Rotate your device to landscape">
    </div>
</body>

</html>
